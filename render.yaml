services:
  - type: web
    name: wari-receipt-ocr
    runtime: python
    plan: free
    rootDir: services/receipt_ocr
    buildCommand: pip install -r requirements.txt
    startCommand: python api.py
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: OCR_HOST
        value: 0.0.0.0
      - key: OCR_BACKEND
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_OCR_MODEL
        value: gemini-2.5-flash
      - key: OCR_CORS_ORIGIN
        value: "*"
      - key: OCR_MAX_BODY_SIZE
        value: "10485760"
